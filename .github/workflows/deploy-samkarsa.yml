name: Deploy Samkarsa to VPS

on:
  push:
    branches:
      - main
    paths:
      - 'packages/samkarsa/**'
      - '.github/workflows/deploy-samkarsa.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11.5.2

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Samkarsa Website
        run: pnpm --filter @web/samkarsa build

      - name: Copy Build Files directly to VPS Folder Mounted by web-samkarsa-porto
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "packages/samkarsa/dist/*"
          target: "/root/web/samkarsa-html"
          strip_components: 3
