name: Deploy Samkarsa to VPS Container

on:
  push:
    branches:
      - main
    paths:
      - 'packages/samkarsa/**'
      - '.github/workflows/deploy-samkarsa.yml'
      - 'Dockerfile.samkarsa'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.samkarsa
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/web-samkarsa-porto:latest

      - name: Deploy to VPS Container via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            echo "Pulling latest image for web-samkarsa-porto..."
            docker pull ${{ secrets.DOCKER_USERNAME }}/web-samkarsa-porto:latest
            
            echo "Restarting container web-samkarsa-porto..."
            docker stop web-samkarsa-porto || true
            docker rm web-samkarsa-porto || true
            
            docker run -d \
              --name web-samkarsa-porto \
              --restart always \
              -p 8081:80 \
              ${{ secrets.DOCKER_USERNAME }}/web-samkarsa-porto:latest
            
            echo "Deployment web-samkarsa-porto completed!"
