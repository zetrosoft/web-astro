name: Deploy Samkarsa (Build & Copy to Container)

on:
  push:
    branches:
      - main
    paths:
      - 'packages/samkarsa/**'
      - '.github/workflows/deploy-samkarsa.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11.5.2

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Samkarsa Website
        run: pnpm --filter @web/samkarsa build

      - name: Copy Build Files to VPS Temp Folder
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "packages/samkarsa/dist/*"
          target: "/tmp/samkarsa-dist"
          strip_components: 3

      - name: Sync Build Files into web-samkarsa-porto Container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            echo "Copying dist files into Docker container web-samkarsa-porto..."
            docker cp /tmp/samkarsa-dist/. web-samkarsa-porto:/usr/share/nginx/html/
            rm -rf /tmp/samkarsa-dist
            echo "Successfully updated web-samkarsa-porto container!"
