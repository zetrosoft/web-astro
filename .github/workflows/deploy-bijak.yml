name: Deploy Bijak Technology to VPS

# Catatan: Penjadwalan produksi artikel & deployment harian (3x sehari)
# telah dialihkan 100% secara otonom ke VPS crontab (zero GitHub Actions dependency).
# Workflow ini hanya dipertahankan sebagai manual fallback (workflow_dispatch).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack & Install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Bijak Technology Website
        run: pnpm --filter @web/bijak build

      - name: Copy Build Files directly to VPS Folder Mounted by web-bijak-techno
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 64000
          source: "packages/bijak/dist/*"
          target: "/root/web/bijak-techno-html"
          strip_components: 3
          timeout: 120s
          command_timeout: 30m

      - name: Send WhatsApp Notification via BiZETO Hub
        if: always()
        run: |
          python3 -c "
          import urllib.request, json, os

          status = '✅ SUCCESS' if '${{ job.status }}' == 'success' else '❌ FAILED'
          website = 'https://bijaktechnology.com'
          commit_sha = '${{ github.sha }}'[:7]
          author = '${{ github.actor }}'
          msg_head = '''${{ github.event.head_commit.message }}'''.strip()
          event_name = '${{ github.event_name }}'

          message_text = (
              '🚀 *PUBLIKASI & DEPLOYMENT: BIJAK TECHNOLOGY*\n\n'
              f'*Status:* {status}\n'
              f'*Trigger:* {event_name.upper()}\n'
              f'*Website:* {website}\n'
              f'*Container:* web-bijak-techno\n'
              f'*Commit:* {commit_sha}\n'
              f'*Author:* {author}\n'
              f'*Ringkasan:* {msg_head}'
          )

          payload = json.dumps({
              'device_jid': '6285600239869@s.whatsapp.net',
              'to': '6281219987377@s.whatsapp.net',
              'message': message_text
          }).encode('utf-8')

          req = urllib.request.Request(
              'https://bizeto.samkarsa.com/api/send',
              data=payload,
              headers={
                  'Authorization': 'Bearer ${{ secrets.BIZETO_WA_TOKEN }}',
                  'Content-Type': 'application/json'
              }
          )

          try:
              with urllib.request.urlopen(req, timeout=15) as response:
                  print('WhatsApp Notification Response:', response.read().decode('utf-8'))
          except Exception as e:
              print('Failed to send WhatsApp notification:', e)
          "
