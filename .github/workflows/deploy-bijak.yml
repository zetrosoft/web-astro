name: Deploy Bijak Technology to VPS

on:
  push:
    branches:
      - main
    paths:
      - 'packages/bijak/**'
      - '.github/workflows/deploy-bijak.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
  schedule:
    # Jadwal Publikasi Otomatis 3x Sehari (WIB = UTC+7):
    # - 05:30 WIB -> 22:30 UTC (Hari sebelumnya)
    # - 11:30 WIB -> 04:30 UTC
    # - 19:00 WIB -> 12:00 UTC
    - cron: '30 22 * * *'
    - cron: '30 4 * * *'
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack & Install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Bijak Technology Website
        run: pnpm --filter @web/bijak build

      - name: Copy Build Files directly to VPS Folder Mounted by web-bijak-techno
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 64000
          source: "packages/bijak/dist/*"
          target: "/root/web/bijak-techno-html"
          strip_components: 3
          timeout: 120s
          command_timeout: 30m

      - name: Send WhatsApp Notification via BiZETO Hub
        if: always()
        run: |
          python3 -c "
          import urllib.request, json

          status = '✅ SUCCESS' if '${{ job.status }}' == 'success' else '❌ FAILED'
          website = 'https://bijaktechnology.com'
          commit_sha = '${{ github.sha }}'[:7]
          author = '${{ github.actor }}'
          msg_head = '''${{ github.event.head_commit.message }}'''.strip()

          message_text = (
              '🚀 *DEPLOYMENT NOTIFICATION: BIJAK TECHNOLOGY*\n\n'
              f'*Status:* {status}\n'
              f'*Website:* {website}\n'
              f'*Container:* web-bijak-techno\n'
              f'*Commit:* {commit_sha}\n'
              f'*Author:* {author}\n'
              f'*Message:* {msg_head}'
          )

          payload = json.dumps({
              'device_jid': '6285600239869@s.whatsapp.net',
              'to': '6281219987377@s.whatsapp.net',
              'message': message_text
          }).encode('utf-8')

          req = urllib.request.Request(
              'https://bizeto.samkarsa.com/api/send',
              data=payload,
              headers={
                  'Authorization': 'Bearer ${{ secrets.BIZETO_WA_TOKEN }}',
                  'Content-Type': 'application/json'
              }
          )

          try:
              with urllib.request.urlopen(req, timeout=15) as response:
                  print('WhatsApp Notification Response:', response.read().decode('utf-8'))
          except Exception as e:
              print('Failed to send WhatsApp notification:', e)
          "

