name: Deploy Bijak Technology to VPS

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'packages/bijak/**'
      - '.github/workflows/deploy-bijak.yml'
      - 'Dockerfile.bijak'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.bijak
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/bijak-web:latest

      - name: Deploy to VPS Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            echo "Pulling latest image for Bijak Technology..."
            docker pull ${{ secrets.DOCKER_USERNAME }}/bijak-web:latest
            
            echo "Updating container on VPS..."
            docker stop bijak-web-container || true
            docker rm bijak-web-container || true
            
            docker run -d \
              --name bijak-web-container \
              --restart always \
              -p 8080:80 \
              ${{ secrets.DOCKER_USERNAME }}/bijak-web:latest
            
            echo "Deployment completed successfully!"
