name: Deploy Bijak Technology to VPS

on:
  push:
    branches:
      - main
    paths:
      - 'packages/bijak/**'
      - '.github/workflows/deploy-bijak.yml'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:
    inputs:
      slot:
        description: 'Slot Publikasi (auto, pagi, siang, malam)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - pagi
          - siang
          - malam
      force:
        description: 'Paksa generate topik baru'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate Scheduled Content via Gemini API
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          SLOT_ARG=""
          if [ "${{ github.event.inputs.slot }}" != "" ] && [ "${{ github.event.inputs.slot }}" != "auto" ]; then
            SLOT_ARG="--slot=${{ github.event.inputs.slot }}"
          fi
          FORCE_ARG=""
          if [ "${{ github.event.inputs.force }}" == "true" ]; then
            FORCE_ARG="--force"
          fi
          node scripts/generate-article.mjs $SLOT_ARG $FORCE_ARG

      - name: Commit & Push New Generated Articles to Main
        run: |
          if [ -n "$(git status --porcelain packages/bijak/src/content)" ]; then
            echo "Menemukan artikel baru, melakukan commit dan push ke main..."
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add packages/bijak/src/content/
            git commit -m "feat(blog): automated scheduled publication [skip ci]"
            git push origin main
          else
            echo "Tidak ada artikel baru atau konten sudah mutakhir."
          fi

      - name: Enable Corepack & Install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Bijak Technology Website
        run: pnpm --filter @web/bijak build

      - name: Copy Build Files directly to VPS Folder Mounted by web-bijak-techno
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 64000
          source: "packages/bijak/dist/*"
          target: "/root/web/bijak-techno-html"
          strip_components: 3
          timeout: 120s
          command_timeout: 30m

      - name: Send WhatsApp Notification via BiZETO Hub
        if: always()
        run: |
          python3 -c "
          import urllib.request, json, os

          status = '✅ SUCCESS' if '${{ job.status }}' == 'success' else '❌ FAILED'
          website = 'https://bijaktechnology.com'
          commit_sha = '${{ github.sha }}'[:7]
          author = '${{ github.actor }}'
          msg_head = '''${{ github.event.head_commit.message }}'''.strip()
          event_name = '${{ github.event_name }}'

          message_text = (
              '🚀 *PUBLIKASI & DEPLOYMENT: BIJAK TECHNOLOGY*\n\n'
              f'*Status:* {status}\n'
              f'*Trigger:* {event_name.upper()}\n'
              f'*Website:* {website}\n'
              f'*Container:* web-bijak-techno\n'
              f'*Commit:* {commit_sha}\n'
              f'*Author:* {author}\n'
              f'*Ringkasan:* {msg_head}'
          )

          payload = json.dumps({
              'device_jid': '6285600239869@s.whatsapp.net',
              'to': '6281219987377@s.whatsapp.net',
              'message': message_text
          }).encode('utf-8')

          req = urllib.request.Request(
              'https://bizeto.samkarsa.com/api/send',
              data=payload,
              headers={
                  'Authorization': 'Bearer ${{ secrets.BIZETO_WA_TOKEN }}',
                  'Content-Type': 'application/json'
              }
          )

          try:
              with urllib.request.urlopen(req, timeout=15) as response:
                  print('WhatsApp Notification Response:', response.read().decode('utf-8'))
          except Exception as e:
              print('Failed to send WhatsApp notification:', e)
          "
