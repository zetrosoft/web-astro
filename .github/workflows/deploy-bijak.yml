name: Deploy Bijak Technology to VPS

on:
  push:
    branches:
      - main
    paths:
      - 'packages/bijak/**'
      - '.github/workflows/deploy-bijak.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack & Install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Bijak Technology Website
        run: pnpm --filter @web/bijak build

      - name: Copy Build Files directly to VPS Folder Mounted by web-bijak-techno
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 64000
          source: "packages/bijak/dist/*"
          target: "/root/web/bijak-techno-html"
          strip_components: 3

      - name: Send Telegram Notification
        if: always()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO || '326009233' }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          message: |
            *🚀 DEPLOYMENT NOTIFICATION: BIJAK TECHNOLOGY*
            
            *Status:* ${{ job.status == 'success' && '✅ SUCCESS' || '❌ FAILED' }}
            *Website:* https://bijaktechnology.com
            *Container:* `web-bijak-techno`
            *Target User:* @zetro_21 (ID: 326009233)
            *Commit:* `${{ github.sha }}`
            *Author:* `${{ github.actor }}`
            *Message:* `${{ github.event.head_commit.message }}`
