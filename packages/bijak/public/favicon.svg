<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <!-- Rounded Squircle Base (Deep Navy) -->
  <rect width="128" height="128" rx="28" fill="#0E2338"/>
  
  <!-- Outer Brackets [ ] -->
  <path d="M 28 38 L 20 38 L 20 90 L 28 90" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 100 38 L 108 38 L 108 90 L 100 90" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Open Book Silhouette (Tech Teal) -->
  <!-- Left Page -->
  <path d="M 64 36 C 52 28 36 30 32 32 L 32 82 C 38 80 52 80 64 88 Z" fill="none" stroke="#008F85" stroke-width="4.5" stroke-linejoin="round"/>
  <!-- Right Page -->
  <path d="M 64 36 C 76 28 92 30 96 32 L 96 82 C 90 80 76 80 64 88 Z" fill="none" stroke="#008F85" stroke-width="4.5" stroke-linejoin="round"/>
  <!-- Center Book Spine -->
  <line x1="64" y1="36" x2="64" y2="88" stroke="#008F85" stroke-width="4"/>
  
  <!-- Digital Circuit Letter 'B' / Node -->
  <!-- Upper Node -->
  <circle cx="48" cy="52" r="3" fill="#008F85" stroke="#FFFFFF" stroke-width="1.5"/>
  <path d="M 51 52 L 58 52 L 62 58" stroke="#008F85" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Middle Node -->
  <circle cx="44" cy="62" r="3" fill="#008F85" stroke="#FFFFFF" stroke-width="1.5"/>
  <line x1="47" y1="62" x2="60" y2="62" stroke="#008F85" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Lower Node -->
  <circle cx="48" cy="72" r="3" fill="#008F85" stroke="#FFFFFF" stroke-width="1.5"/>
  <path d="M 51 72 L 58 72 L 62 66" stroke="#008F85" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Circuit Exit Node on Right -->
  <line x1="78" y1="64" x2="84" y2="64" stroke="#008F85" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="86" cy="64" r="3" fill="#008F85" stroke="#FFFFFF" stroke-width="1.5"/>

  <!-- Bold 'B' Tech Symbol in center -->
  <path d="M 60 50 L 71 50 C 75 50 78 53 78 57 C 78 61 75 63 71 63 L 60 63 Z" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round"/>
  <path d="M 60 63 L 73 63 C 77.5 63 80.5 66 80.5 70.5 C 80.5 75 77 78 72 78 L 60 78 Z" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round"/>
</svg>
